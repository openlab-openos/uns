[package]
name = "ons"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ons"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build","anchor-spl/idl-build"]

[dependencies]
anchor-lang = {git="https://github.com/openlab-openos/anchor.git", package="anchor-lang", features = ["init-if-needed"]}
anchor-spl = {git="https://github.com/openlab-openos/anchor.git", package="anchor-spl"}
spl-token-2022 = { git="https://github.com/openlab-openos/open-token.git", package = "spl-token-2022", features = ["no-entrypoint"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5"